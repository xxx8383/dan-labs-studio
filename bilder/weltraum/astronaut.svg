<svg xmlns="http://www.w3.org/2000/svg" width="96" height="132" viewBox="0 0 96 132">
<!-- Schatten auf dem Mondboden -->
<ellipse cx="44" cy="128" rx="14" ry="2.4" fill="#000" fill-opacity=".14"/>
<g transform="translate(0 -10)">
  <!-- hinteres Bein und Arm -->
  <rect x="34" y="88" width="10" height="26" rx="5" fill="#D5D9E1" transform="rotate(14 39 88)"/>
  <rect x="31" y="108" width="14" height="7" rx="3" fill="#8E939C" transform="rotate(14 39 88)"/>
  <!-- Rucksack -->
  <rect x="20" y="56" width="16" height="32" rx="5" fill="#DDE0E7"/>
  <!-- Rumpf -->
  <rect x="28" y="58" width="30" height="36" rx="11" fill="#F4F5F8"/>
  <rect x="36" y="70" width="14" height="8" rx="2" fill="#DDE0E7"/>
  <rect x="38" y="72" width="3" height="4" fill="#D9473F"/><rect x="43" y="72" width="3" height="4" fill="#2F6FDB"/>
  <!-- vorderes Bein -->
  <rect x="44" y="88" width="10" height="26" rx="5" fill="#F4F5F8" transform="rotate(-10 49 88)"/>
  <rect x="44" y="108" width="15" height="7" rx="3" fill="#8E939C" transform="rotate(-10 49 88)"/>
  <!-- Arm nach unten -->
  <line x1="32" y1="64" x2="26" y2="84" stroke="#D5D9E1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="25.5" cy="86" r="4.5" fill="#8E939C"/>
  <!-- Arm nach oben, fängt den Stern -->
  <line x1="54" y1="64" x2="66" y2="40" stroke="#F4F5F8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="67" cy="37" r="5" fill="#8E939C"/>
  <!-- Helm -->
  <circle cx="43" cy="46" r="16" fill="#F4F5F8"/>
  <rect x="35" y="58" width="18" height="5" rx="2.5" fill="#D5D9E1"/>
  <ellipse cx="46" cy="45" rx="10.5" ry="9" fill="#B57D16"/>
  <ellipse cx="47.5" cy="43" rx="8" ry="6.5" fill="#F2C14E"/>
  <ellipse cx="50" cy="41" rx="2.6" ry="1.8" fill="#fff" fill-opacity=".7"/>
  <rect x="28" y="40" width="4" height="10" rx="2" fill="#D9473F"/>
</g>
<!-- Stern, der gefangen wird -->
<g transform="translate(2 4)"><path d="M68 4 l3.2 6.6 7.2 1 -5.2 5 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.2 -5 7.2 -1z" fill="#FFC94D" stroke="#E09A00" stroke-width="1"/></g>
<g fill="#FFE08A"><circle cx="60" cy="10" r="1.4"/><circle cx="80" cy="12" r="1.2"/><circle cx="76" cy="2" r="1"/></g>
</svg>
